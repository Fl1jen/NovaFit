<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaFit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Набор массы: норма КБЖУ, меню из твоих продуктов, сон и тренировки под инвентарь">
<meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NovaFit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view" class="view" tabindex="-1"></main>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="timer" class="timer" role="timer" aria-live="off" hidden>
  <div class="timer-in">
    <svg class="timer-ring" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="22" class="tr-bg"/><circle id="timer-arc" cx="26" cy="26" r="22" class="tr-fg" transform="rotate(-90 26 26)"/></svg>
    <div class="timer-txt"><b id="timer-num" class="num">0:00</b><span id="timer-label"></span></div>
    <div class="timer-btns">
      <button class="timer-btn" data-act="timer-add" data-d="-15" aria-label="Минус 15 секунд">−15</button>
      <button class="timer-btn" data-act="timer-add" data-d="15" aria-label="Плюс 15 секунд">+15</button>
      <button class="timer-btn skip" data-act="timer-stop">Готово</button>
    </div>
  </div>
</div>

<nav class="nav" aria-label="Разделы">
  <div class="nav-in">
    <span class="nav-ind" aria-hidden="true"></span>
    <button class="nav-btn" data-act="tab" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg><span>Сегодня</span></button>
    <button class="nav-btn" data-act="tab" data-tab="food">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M8 7.5c0-1.5 1-1.5 1-3M12 7.5c0-1.5 1-1.5 1-3M16 7.5c0-1.5 1-1.5 1-3"/></svg><span>Еда</span></button>
    <button class="nav-fab" data-act="add" aria-label="Добавить: еду, продукты, вес, сон">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="nav-btn" data-act="tab" data-tab="train">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="8" width="4" height="8" rx="1"/><rect x="17.5" y="8" width="4" height="8" rx="1"/><path d="M6.5 12h11"/></svg><span>Тренировка</span></button>
    <button class="nav-btn" data-act="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17l5-5 4 4 8-8"/><path d="M14.5 8h6v6"/></svg><span>Прогресс</span></button>
  </div>
</nav>

<script src="js/data-foods.js"></script>
<script src="js/data-recipes.js"></script>
<script src="js/data-exercises.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/planner.js"></script>
<script src="js/workout.js"></script>
<script src="js/insights.js"></script>
<script src="js/scanner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
