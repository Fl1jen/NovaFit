<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaFit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Набор массы: норма КБЖУ, меню из твоих продуктов, сон и тренировки под инвентарь">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NovaFit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <span class="logo">Nova<span>Fit</span></span>
    <span class="topbar-sub">набор массы</span>
  </div>
</header>
<main id="view" class="view" tabindex="-1"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="timer" class="timer" role="timer" aria-live="off" hidden>
  <div class="timer-in">
    <svg class="timer-ring" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="22" class="tr-bg"/><circle id="timer-arc" cx="26" cy="26" r="22" class="tr-fg" transform="rotate(-90 26 26)"/></svg>
    <div class="timer-txt"><b id="timer-num" class="num">0:00</b><span id="timer-label"></span></div>
    <div class="timer-btns">
      <button class="timer-btn" data-act="timer-add" data-d="-15" aria-label="Минус 15 секунд">−15</button>
      <button class="timer-btn" data-act="timer-add" data-d="15" aria-label="Плюс 15 секунд">+15</button>
      <button class="timer-btn skip" data-act="timer-stop">Готово</button>
    </div>
  </div>
</div>
<nav class="nav" aria-label="Разделы">
  <span class="nav-ind" aria-hidden="true"></span>
  <button class="nav-btn" data-act="tab" data-tab="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg><span>Сегодня</span></button>
  <button class="nav-btn" data-act="tab" data-tab="food">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M8 7.5c0-1.5 1-1.5 1-3M12 7.5c0-1.5 1-1.5 1-3M16 7.5c0-1.5 1-1.5 1-3"/></svg><span>Питание</span></button>
  <button class="nav-btn" data-act="tab" data-tab="train">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="8" width="4" height="8" rx="1"/><rect x="17.5" y="8" width="4" height="8" rx="1"/><path d="M6.5 12h11"/></svg><span>Трен.</span></button>
  <button class="nav-btn" data-act="tab" data-tab="sleep">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></svg><span>Сон</span></button>
  <button class="nav-btn" data-act="tab" data-tab="profile">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg><span>Профиль</span></button>
</nav>
<script src="js/data-foods.js"></script>
<script src="js/data-recipes.js"></script>
<script src="js/data-exercises.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/planner.js"></script>
<script src="js/workout.js"></script>
<script src="js/insights.js"></script>
<script src="js/scanner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
