plugins {
    id 'com.android.application'
}

// Ключ подписи. Один и тот же ключ нужен, чтобы новые версии APK ставились
// поверх старой без удаления (и без потери данных).
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'app.novafit'
    compileSdk 34

    defaultConfig {
        applicationId 'app.novafit'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '2.0'
    }

    signingConfigs {
        release {
            if (ksProps['storeFile']) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
