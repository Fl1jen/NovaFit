<script>
/* NovaFit — планировщик питания.
 *  • расписание приёмов пищи по сну;
 *  • подбор граммовок под норму БЖУ (решатель с ограничениями);
 *  • выбор рецептов из того, что есть дома, с приоритетом «доесть остатки»;
 *  • список покупок по нехватке на ближайшие дни.
 */
(function (g) {
  const NF = (g.NF = g.NF || {});

  const MEAL_SHARE = { b: 0.25, l: 0.30, s: 0.15, d: 0.30 };
  const MEAL_ORDER = ['b', 'l', 's', 'd'];

  // ───────── время ─────────
  function toMin(hhmm) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || '');
    if (!m) return null;
    return (+m[1] % 24) * 60 + (+m[2] % 60);
  }
  function fromMin(n) {
    n = ((Math.round(n) % 1440) + 1440) % 1440;
    const h = Math.floor(n / 60), m = n % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  function sleepMinutes(bed, wake) {
    const b = toMin(bed), w = toMin(wake);
    if (b == null || w == null) return null;
    return (w - b + 1440) % 1440 || 1440;
  }
  function roundTo5(n) { return Math.round(n / 5) * 5; }

  function slotAt(type, min, share, label) { return { type: type, time: fromMin(roundTo5(min)), share: share, label: label }; }

  /**
   * Расписание: завтрак через ~40 мин после подъёма, ужин за 3 часа до сна
   * (поздняя еда ухудшает сон), обед и перекус между ними. Если задано время
   * тренировки — перекус ставим за 1,5 ч до неё.
   * mode 'six' (режим «нет аппетита»): 6 приёмов поменьше — завтрак, перекус,
   * обед, перекус, ужин и белковый перекус за 1–1,5 ч до сна.
   */
  function mealSchedule(wake, bed, trainTime, mode) {
    const W = toMin(wake) != null ? toMin(wake) : 450;
    let B = toMin(bed) != null ? toMin(bed) : 1410;
    if (B <= W) B += 1440;
    const b = W + 40;
    let d = B - 180;
    if (d - b < 6 * 60) d = Math.min(B - 90, b + 6 * 60); // короткий день — ужин не раньше чем через 6 ч после завтрака
    let note = null;
    let T = toMin(trainTime);
    if (T != null) { if (T < W) T += 1440; if (!(T > W && T < B)) T = null; }

    if (mode === 'six') {
      const s1 = b + (d - b) * 0.25, l = b + (d - b) * 0.5;
      let s2 = b + (d - b) * 0.78;
      let late = Math.max(d + 60, B - 75);
      if (late > B - 30) late = null; // слишком близко ко сну — без позднего перекуса
      if (T != null) {
        const pre = T - 90;
        if (pre > l + 90 && pre < d - 45) { s2 = pre; note = 'Перекус за 1,5 ч до тренировки, ужин после неё.'; }
        else if (T < l) note = 'Тренировка утром: завтрак лёгкий, полноценный обед сразу после.';
        else note = 'Постарайся поесть в течение 1–2 часов после тренировки.';
      }
      const meals = [
        slotAt('b', b, 0.20, 'Завтрак'), slotAt('s', s1, 0.12, 'Перекус'), slotAt('l', l, 0.23, 'Обед'),
        slotAt('s', s2, 0.13, 'Перекус'), slotAt('d', d, 0.20, 'Ужин'),
      ];
      if (late != null) { const n = slotAt('s', late, 0.12, 'Перед сном'); n.night = true; meals.push(n); }
      const total = meals.reduce(function (sum, m) { return sum + m.share; }, 0);
      meals.forEach(function (m) { m.share = m.share / total; });
      return { meals: meals, note: note, mode: 'six' };
    }

    let l = b + (d - b) * 0.42;
    let sn = b + (d - b) * 0.72;
    if (T != null) {
      const pre = T - 90;
      if (pre > l + 120 && pre < d - 45) { sn = pre; note = 'Перекус за 1,5 ч до тренировки, ужин после неё.'; }
      else if (T < l) note = 'Тренировка утром: завтрак лёгкий, полноценный обед сразу после.';
      else note = 'Постарайся поесть в течение 1–2 часов после тренировки.';
    }
    return {
      meals: [
        slotAt('b', b, MEAL_SHARE.b, 'Завтрак'),
        slotAt('l', l, MEAL_SHARE.l, 'Обед'),
        slotAt('s', sn, MEAL_SHARE.s, 'Перекус'),
        slotAt('d', d, MEAL_SHARE.d, 'Ужин'),
      ],
      note: note,
      mode: 'four',
    };
  }

  // ───────── продукты ─────────
  function allFoods(custom) { return NF.FOODS.concat(custom || []); }
  function foodMap(custom) {
    const m = {};
    allFoods(custom).forEach(function (f) { m[f.id] = f; });
    return m;
  }

  function roundFood(food, grams) {
    if (grams <= 0) return 0;
    if (food.perUnit && (food.unit === 'шт' || food.unit === 'ломтик' || food.unit === 'лист' || food.unit === 'банка')) {
      // половинки допускаем для хлеба/лаваша/банок, яйца — только целые
      const step = food.unit === 'шт' ? 1 : 0.5;
      const units = Math.max(step, Math.round(grams / food.perUnit / step) * step);
      return Math.round(units * food.perUnit);
    }
    if (grams < 30) return Math.max(1, Math.round(grams));
    return roundTo5(grams);
  }

  function macrosOf(items, fm) {
    const t = { kcal: 0, p: 0, f: 0, c: 0 };
    items.forEach(function (it) {
      const f = fm[it.id];
      if (!f) return;
      const k = it.g / 100;
      t.kcal += f.kcal * k; t.p += f.p * k; t.f += f.f * k; t.c += f.c * k;
    });
    return t;
  }

  /**
   * Решатель порций: минимизирует взвешенную относительную ошибку по
   * ккал/Б/Ж/У с границами lo ≤ x ≤ hi (координатный спуск, задача выпуклая).
   * vars: [{food, lo, hi, x0, reg}]
   */
  function solve(vars, target) {
    const keys = ['kcal', 'p', 'f', 'c'];
    const W = { kcal: 2.0, p: 1.5, f: 0.8, c: 0.8 };
    const T = {};
    keys.forEach(function (k) { T[k] = Math.max(1, target[k]); });
    const x = vars.map(function (v) { return Math.min(v.hi, Math.max(v.lo, v.x0 != null ? v.x0 : (v.lo + v.hi) / 2)); });
    const A = vars.map(function (v) { return { kcal: v.food.kcal / 100, p: v.food.p / 100, f: v.food.f / 100, c: v.food.c / 100 }; });
    const sum = {};
    function recompute() {
      keys.forEach(function (k) { sum[k] = 0; });
      x.forEach(function (xi, i) { keys.forEach(function (k) { sum[k] += A[i][k] * xi; }); });
    }
    recompute();
    for (let iter = 0; iter < 300; iter++) {
      let moved = 0;
      for (let i = 0; i < x.length; i++) {
        const v = vars[i];
        let grad = 0, hess = 0;
        keys.forEach(function (k) {
          const w = W[k] / (T[k] * T[k]);
          grad += 2 * w * A[i][k] * (sum[k] - T[k]);
          hess += 2 * w * A[i][k] * A[i][k];
        });
        if (v.reg && v.x0) {
          const r = v.reg / (v.x0 * v.x0);
          grad += 2 * r * (x[i] - v.x0);
          hess += 2 * r;
        }
        if (hess <= 0) continue;
        const nx = Math.min(v.hi, Math.max(v.lo, x[i] - grad / hess));
        const d = nx - x[i];
        if (d !== 0) {
          keys.forEach(function (k) { sum[k] += A[i][k] * d; });
          x[i] = nx;
          moved += Math.abs(d);
        }
      }
      if (moved < 0.05) break;
    }
    return x;
  }

  function fitError(m, target) {
    function rel(a, b) { return b > 0 ? (a - b) / b : 0; }
    return 2 * Math.pow(rel(m.kcal, target.kcal), 2) + 1.5 * Math.pow(rel(m.p, target.p), 2) +
      0.8 * Math.pow(rel(m.f, target.f), 2) + 0.8 * Math.pow(rel(m.c, target.c), 2);
  }

  // ───────── рецепт под цель ─────────
  // Мелкие добавки: если их нет дома, блюдо можно приготовить и без них.
  const MINOR = { sunflower_oil: 1, olive_oil: 1, butter: 1, honey: 1, tomato_paste: 1, smetana: 1, onion: 1, raisins: 1 };

  /** Граммы замены: белковые продукты пересчитываем по белку, остальные — по калориям. */
  function subGrams(base, from, to) {
    let g;
    const sameKind = (from.cat === 'veg' && to.cat === 'veg') || (from.cat === 'fruit' && to.cat === 'fruit');
    const kcalRatio = Math.max(from.kcal, to.kcal) / Math.max(1, Math.min(from.kcal, to.kcal));
    if (sameKind && kcalRatio < 2) g = base;
    else if ((from.cat === 'protein' || from.cat === 'dairy') && from.p >= 8 && to.p >= 5) g = base * from.p / to.p;
    else g = base * from.kcal / Math.max(1, to.kcal);
    return Math.max(base * 0.5, Math.min(base * 2.5, g));
  }

  /**
   * Что из рецепта есть дома: сам продукт, его замена (NF.SUBS) или нехватка.
   * ings: [{food, base, opt, sub: id заменённого продукта | null, missing}], skipped: [id].
   * strict (список покупок): мелкие добавки не пропускаются, а покупаются.
   */
  function resolveRecipe(recipe, inv, fm, strict) {
    const used = {};
    recipe.ing.forEach(function (row) { used[row[0]] = 1; });
    const ings = [], skipped = [];
    recipe.ing.forEach(function (row) {
      const f = fm[row[0]];
      if (!f) return;
      const base = row[1], opt = !!row[2];
      if ((inv[f.id] || 0) >= base * 0.6) { ings.push({ food: f, base: base, opt: opt, sub: null, missing: false }); return; }
      if (opt) return; // необязательное — только если есть
      const subs = (NF.SUBS && NF.SUBS[f.id]) || [];
      for (let i = 0; i < subs.length; i++) {
        const sf = fm[subs[i]];
        if (!sf || used[sf.id]) continue;
        const sb = subGrams(base, f, sf);
        if ((inv[sf.id] || 0) >= sb * 0.6) {
          used[sf.id] = 1;
          ings.push({ food: sf, base: sb, opt: false, sub: f.id, missing: false });
          return;
        }
      }
      if (!strict && MINOR[f.id]) { skipped.push(f.id); return; }
      ings.push({ food: f, base: base, opt: false, sub: null, missing: true });
    });
    return { ings: ings, skipped: skipped };
  }

  /**
   * Подогнать рецепт под цель приёма пищи. inv — {id: граммы} (то, что есть дома);
   * нехватка уходит в missing, замены — в subs. opt.dense — режим «нет аппетита»
   * (меньше овощей: они занимают место в желудке).
   */
  function fitRecipe(recipe, target, inv, fm, strict, opt) {
    opt = opt || {};
    const rs = resolveRecipe(recipe, inv, fm, strict);
    const baseM = macrosOf(rs.ings.map(function (i) { return { id: i.food.id, g: i.base }; }), fm);
    const s = Math.min(2.2, Math.max(0.6, target.kcal / Math.max(1, baseM.kcal)));
    const vars = rs.ings.map(function (i) {
      let lo, hi;
      if (i.food.cat === 'veg') { lo = i.base * (opt.dense ? 0.4 : 0.5); hi = i.base * (opt.dense ? 1.0 : 1.6); }
      else { lo = i.base * 0.6; hi = i.base * 2.2; }
      hi = Math.min(hi, Math.max(i.food.maxMeal, i.base));
      if (i.food.id === 'eggs') hi = Math.min(hi, 220); // до 4 яиц за приём
      lo = Math.min(lo, hi);
      return { food: i.food, lo: lo, hi: hi, x0: Math.min(hi, Math.max(lo, i.base * s)), reg: 0.15, ing: i };
    });
    const x = solve(vars, target);
    const items = [], missing = [], subs = [];
    vars.forEach(function (v, k) {
      const gr = roundFood(v.food, x[k]);
      if (gr <= 0) return;
      const it = { id: v.food.id, g: gr };
      if (v.ing.sub) { it.sub = v.ing.sub; subs.push({ from: v.ing.sub, to: v.food.id }); }
      items.push(it);
      const have = inv[v.food.id] || 0;
      if (have < gr) missing.push({ id: v.food.id, g: gr - have });
    });
    const m = macrosOf(items, fm);
    return { recipeId: recipe.id, items: items, missing: missing, skipped: rs.skipped, subs: subs, macros: m, err: fitError(m, target) };
  }

  /** «Тарелка» из того, что лежит дома, если ни один рецепт не собирается. */
  function plateFromStock(type, target, inv, fm, rng, urgency, night) {
    urgency = urgency || {};
    const avail = Object.keys(inv).filter(function (id) { return fm[id] && !fm[id].noplan && inv[id] >= 20; }).map(function (id) { return fm[id]; });
    if (!avail.length) return null;
    function weight(f) { return (inv[f.id] || 0) * (1 + rng() * 0.3) * (1 + (urgency[f.id] || 0) * 4); }
    function byStock(a, b) { return weight(b) - weight(a); }
    function pick(pred) { return avail.filter(pred).sort(byStock)[0]; }
    const light = type === 'b' || type === 's';
    const chosen = [];
    const isProt = function (f) { return f.p * 4 / Math.max(1, f.kcal) > 0.35 && (light || f.cat === 'protein' || f.cat === 'dairy'); };
    // перед сном — молочный белок (творог, кефир, йогурт): он усваивается медленно
    const prot = (night && pick(function (f) { return isProt(f) && f.cat === 'dairy'; })) || pick(isProt);
    if (prot) chosen.push(prot);
    const carb = pick(function (f) { return (f.cat === 'carb' || (light && f.cat === 'fruit')) && chosen.indexOf(f) < 0; });
    if (carb) chosen.push(carb);
    const fat = pick(function (f) { return f.cat === 'fat' && chosen.indexOf(f) < 0; });
    if (fat) chosen.push(fat);
    if (!light) {
      const veg = pick(function (f) { return f.cat === 'veg' && f.id !== 'tomato_paste' && chosen.indexOf(f) < 0; });
      if (veg) chosen.push(veg);
    }
    if (!chosen.length) return null;
    const vars = chosen.map(function (f) {
      const hi = Math.min(f.maxMeal, inv[f.id] || 0);
      // в тарелке всегда есть нормальная порция белка и гарнира/овощей
      let lo = 0;
      if (f === prot) lo = Math.min(hi, light ? 40 : 80);
      else if (f.cat === 'veg') lo = Math.min(hi, 100);
      return { food: f, lo: lo, hi: hi, x0: hi / 2 };
    });
    const x = solve(vars, target);
    const items = [];
    // крошечные порции («3 г курицы», «1 г масла») не предлагаем
    vars.forEach(function (v, i) { const gr = Math.min(roundFood(v.food, x[i]), v.hi); if (gr >= (v.food.cat === 'fat' ? 5 : 15)) items.push({ id: v.food.id, g: gr }); });
    if (!items.length) return null;
    const m = macrosOf(items, fm);
    return { recipeId: null, items: items, missing: [], skipped: [], subs: [], macros: m, err: fitError(m, target) };
  }

  /**
   * Добавка к блюду: если после подгонки не хватает калорий (обычно углеводов),
   * докладываем один продукт из запасов (хлеб, банан, крупа, орехи…).
   * dense (режим «нет аппетита»): только плотные добавки без объёма — орехи,
   * арахисовая паста, сыр, сухофрукты, а к обеду и ужину — ложка масла в гарнир.
   */
  // Продукты, которые нужно варить/запекать: добавкой «как есть» не годятся.
  const NEEDS_COOK = { buckwheat: 1, rice: 1, pasta: 1, bulgur: 1, quinoa: 1, couscous: 1, rice_noodles: 1, lentils: 1, chickpeas: 1, potato: 1, sweet_potato: 1 };

  function topUp(res, type, target, inv, fm, dense) {
    if (!res || res.macros.kcal >= target.kcal * 0.92) return res;
    const have = {};
    res.items.forEach(function (it) { have[it.id] = 1; });
    const light = type === 'b' || type === 's';
    const ok = light ? { carb: 1, fruit: 1, fat: 1, dairy: 1 } : { carb: 1, fruit: 1, fat: 1, veg: 0, dairy: dense ? 1 : 0 };
    let best = null;
    Object.keys(inv).forEach(function (id) {
      const f = fm[id];
      if (!f || f.noplan || have[id] || !ok[f.cat] || inv[id] < 20 || f.kcal < 50) return;
      const oil = f.id === 'sunflower_oil' || f.id === 'olive_oil' || f.id === 'butter';
      if (oil && !(dense && !light)) return; // масло ложкой не едят — только в гарнир в режиме «нет аппетита»
      if (dense && f.kcal < 270) return;
      if (!light && (f.id === 'oats' || f.id === 'honey')) return;
      const cook = !!NEEDS_COOK[f.id];
      if (cook && light) return; // сухую крупу к бутерброду не добавишь
      const deficit = target.kcal - res.macros.kcal;
      const cap = oil ? 15 : f.maxMeal;
      let gr = Math.min(cap, inv[id], (deficit / f.kcal) * 100);
      gr = roundFood(f, gr);
      if (gr > inv[id]) gr = roundFood(f, inv[id] * 0.9);
      if (gr < (oil ? 5 : cook ? (f.kcal > 200 ? 40 : 120) : 10)) return; // гарнир — так гарнир
      const items = res.items.concat([{ id: id, g: gr }]);
      const m = macrosOf(items, fm);
      const e = fitError(m, target);
      if (e < res.err - 0.005 && (!best || e < best.err)) best = { items: items, macros: m, err: e, extra: id, extraDense: !!dense };
    });
    if (!best) return res;
    return Object.assign({}, res, best);
  }

  function hasTag(r, t) { return !!(r.tags && r.tags.indexOf(t) >= 0); }

  /**
   * Продукт «из названия» блюда: заменить его — значит приготовить другое блюдо
   * («Лосось с рисом» из курицы). Такие замены допустимы, но в автоплане
   * идут в самый конец; на экране рецептов они помечаются.
   */
  // Как главный продукт называют в названиях блюд (основы слов).
  const TITLE_ALIASES = {
    fish_white: ['рыб'], salmon: ['рыб', 'лосос'], tuna_can: ['тунц', 'тунец'], shrimp: ['кревет'],
    chicken_breast: ['кур'], chicken_thigh: ['кур'], turkey: ['индейк'], beef: ['говяд', 'бефстроганов', 'гуляш'],
    pork: ['свин'], minced_beef: ['фарш', 'котлет', 'тефтел', 'болоньез'], eggs: ['яйц', 'омлет', 'скрэмбл', 'яичн', 'шакшук'],
    cottage5: ['творог', 'сырник', 'запеканк'], cottage9: ['творог', 'сырник', 'запеканк'], cheese: ['сыр'],
    mozzarella: ['моцарелл', 'капрезе', 'пицц'], tofu: ['тофу'],
  };

  function isTitleIngredient(recipe, foodId, fm) {
    const f = fm[foodId];
    if (!f) return false;
    const title = recipe.name.toLowerCase().replace(/ё/g, 'е');
    const words = f.name.toLowerCase().replace(/ё/g, 'е').replace(/\(.*?\)/g, ' ').split(/[^a-zа-я]+/).filter(function (w) { return w.length >= 3; });
    // первое значимое слово названия продукта (+ варианты через «/»)
    const keys = [words[0]].concat(f.name.indexOf('/') >= 0 ? words.slice(1) : []);
    // основа слова без окончания: «перец» → «пер» (найдёт «перцы»), «гречка» → «греч»
    if (keys.some(function (w) { return w && title.indexOf(w.slice(0, w.length <= 5 ? 3 : 4)) >= 0; })) return true;
    return (TITLE_ALIASES[foodId] || []).some(function (a) { return title.indexOf(a) >= 0; });
  }

  /** Выбор блюда на приём пищи. */
  function pickMeal(type, target, inv, fm, opts) {
    opts = opts || {};
    const rng = opts.rng || Math.random;
    const avoid = opts.avoid || {};
    const cands = NF.RECIPES.filter(function (r) { return r.meals.indexOf(type) >= 0; }).map(function (r) {
      const res = fitRecipe(r, target, inv, fm, opts.strict, { dense: opts.dense });
      const missKcal = res.missing.reduce(function (s, it) { return s + (fm[it.id].kcal * it.g) / 100; }, 0);
      const missShare = missKcal / Math.max(1, res.macros.kcal);
      // «доедаем остатки»: бонус за долю ингредиентов, которые уже есть
      const usedHome = res.items.filter(function (it) { return (inv[it.id] || 0) > 0; }).length / Math.max(1, res.items.length);
      // срочность: блюдо с продуктом, который скоро испортится, поднимается в выборе
      const urg = opts.urgency ? res.items.reduce(function (mx, it) { return Math.max(mx, (opts.urgency[it.id] || 0) * ((inv[it.id] || 0) > 0 ? 1 : 0)); }, 0) : 0;
      let bonus = 0;
      if (opts.dense) {
        // «нет аппетита»: больше калорий в меньшем объёме, на перекус — жидкие калории
        const grams = res.items.reduce(function (sum, it) { return sum + it.g; }, 0);
        const density = res.macros.kcal / Math.max(1, grams);
        bonus += 0.35 * Math.max(0, Math.min(1, (density - 1.0) / 1.5));
        if (type === 's' && hasTag(r, 'liquid')) bonus += 0.2;
      }
      if (opts.night) bonus += hasTag(r, 'night') ? 0.5 : -0.3;
      // замена продукта из названия («Рыба с рисом» из курицы) — другое блюдо: только если иначе никак;
      // штраф сильнее бонуса за скоропортящееся, поэтому сначала берутся «честные» рецепты
      const subPenalty = res.subs.reduce(function (sum, sb) { return sum + (isTitleIngredient(r, sb.from, fm) ? 1.2 : 0.08); }, 0);
      res.score = res.err + res.missing.length * 0.35 + missShare * 1.5 - usedHome * 0.25 - urg * 0.9 +
        subPenalty - bonus + (avoid[r.id] || 0) + rng() * 0.12;
      return res;
    });
    cands.sort(function (a, b) { return a.score - b.score; });
    let best = cands[0];
    if (best && best.missing.length && !opts.allowMissing) {
      const plate = plateFromStock(type, target, inv, fm, rng, opts.urgency, opts.night);
      if (plate && (plate.err < 0.3 || plate.err < best.err + 0.1)) best = plate;
    }
    return topUp(best, type, target, inv, fm, opts.dense);
  }

  // ───────── генератор ─────────
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  function targetFor(daily, share) {
    return { kcal: daily.kcal * share, p: daily.protein * share, f: daily.fat * share, c: daily.carbs * share };
  }

  function subtract(inv, items) {
    items.forEach(function (it) { if (inv[it.id] != null) inv[it.id] = Math.max(0, inv[it.id] - it.g); });
  }

  function mealFromRes(slot, time, res, light) {
    return {
      type: slot.type, time: time, label: slot.label || NF.MEAL_LABEL[slot.type], night: !!slot.night,
      recipeId: res ? res.recipeId : null, items: res ? res.items : [],
      missing: res ? res.missing : [], skipped: res ? res.skipped : [],
      extra: res ? res.extra || null : null, extraDense: !!(res && res.extraDense),
      light: !!light, eaten: false,
    };
  }

  function recipeById(id) {
    for (let i = 0; i < NF.RECIPES.length; i++) if (NF.RECIPES[i].id === id) return NF.RECIPES[i];
    return null;
  }

  /**
   * Общий раскладчик: распределяет ОСТАТОК дневной нормы по несъеденным
   * приёмам. Каждый следующий приём получает долю от того, что осталось,
   * поэтому недобор/перебор одного блюда (или еда вне плана) компенсируется.
   * inv изменяется (резервирует продукты) — передавай копию.
   * opt: { strict, urgency: {id: 0..1}, extraMacros: {kcal,p,f,c}, keep: [meal|null],
   *        pinned: {индекс: id рецепта}, dense }
   */
  function planMeals(date, daily, schedule, inv, fm, recent, seed, opt) {
    opt = opt || {};
    const rng = mulberry32(hashStr(date + ':' + (seed || 0)));
    const avoid = Object.assign({}, recent || {});
    const keep = opt.keep || [];
    const ex = opt.extraMacros || { kcal: 0, p: 0, f: 0, c: 0 };
    const left = { kcal: daily.kcal - ex.kcal, protein: daily.protein - ex.p, fat: daily.fat - ex.f, carbs: daily.carbs - ex.c };
    keep.forEach(function (m) {
      if (!m) return;
      const mm = macrosOf(m.items, fm);
      left.kcal -= mm.kcal; left.protein -= mm.p; left.fat -= mm.f; left.carbs -= mm.c;
      if (m.recipeId) avoid[m.recipeId] = (avoid[m.recipeId] || 0) + 1.5;
    });
    let shareLeft = schedule.meals.reduce(function (s, m, i) { return s + (keep[i] ? 0 : m.share); }, 0);
    const meals = schedule.meals.map(function (slot, i) {
      if (keep[i]) return keep[i];
      const k = Math.min(1, slot.share / Math.max(0.01, shareLeft));
      const base = targetFor(daily, slot.share);
      // норма на день уже почти закрыта — даём лёгкий приём, но не пропуск
      const light = left.kcal * k < base.kcal * 0.5;
      // Нижние границы по макросам: если еда вне плана «съела» почти все жиры,
      // цель 2–3 г жира на приём сделала бы любой нормальный рецепт «ошибкой».
      // Небольшой перебор одного макроса за день безопасен, развал меню — нет.
      const t = light
        ? { kcal: Math.max(150, left.kcal * k), p: Math.max(10, base.p * 0.5, Math.min(base.p, left.protein * k)), f: Math.max(3, base.f * 0.3, Math.min(base.f, left.fat * k)), c: Math.max(15, Math.min(base.c, left.carbs * k)) }
        : { kcal: Math.min(base.kcal * 1.6, left.kcal * k), p: Math.max(base.p * 0.7, Math.min(base.p * 1.6, left.protein * k)), f: Math.max(base.f * 0.5, Math.min(base.f * 1.6, left.fat * k)), c: Math.max(base.c * 0.5, Math.min(base.c * 1.6, left.carbs * k)) };
      shareLeft -= slot.share;
      const pinRec = opt.pinned && opt.pinned[i] ? recipeById(opt.pinned[i]) : null;
      const res = pinRec
        ? fitRecipe(pinRec, t, inv, fm, opt.strict, { dense: opt.dense })
        : pickMeal(slot.type, t, inv, fm, { rng: rng, avoid: avoid, strict: opt.strict, urgency: opt.urgency, dense: opt.dense, night: slot.night });
      if (res && res.recipeId) avoid[res.recipeId] = (avoid[res.recipeId] || 0) + 1.5;
      if (res) {
        subtract(inv, res.items);
        left.kcal -= res.macros.kcal; left.protein -= res.macros.p; left.fat -= res.macros.f; left.carbs -= res.macros.c;
      }
      const meal = mealFromRes(slot, slot.time, res, light);
      if (pinRec) meal.pinned = true;
      return meal;
    });
    return { date: date, meals: meals, seed: seed || 0, mode: schedule.mode || 'four' };
  }

  /** План дня с нуля. */
  function planDay(date, daily, schedule, inv, fm, recent, seed, strict, opt) {
    return planMeals(date, daily, schedule, inv, fm, recent, seed, Object.assign({}, opt || {}, { strict: strict }));
  }

  /**
   * Пересобрать несъеденные приёмы с учётом съеденного и еды вне плана.
   * Съеденные приёмы сохраняются как есть, закреплённые рецепты — подгоняются заново.
   */
  function planRest(plan, daily, schedule, inv, fm, recent, seed, opt) {
    const same = plan.meals.length === schedule.meals.length;
    const keep = same ? plan.meals.map(function (m) { return m.eaten ? m : null; }) : [];
    const pinned = {};
    if (same) plan.meals.forEach(function (m, i) { if (!m.eaten && m.pinned && m.recipeId) pinned[i] = m.recipeId; });
    const res = planMeals(plan.date, daily, schedule, inv, fm, recent, seed, Object.assign({}, opt || {}, { keep: keep, pinned: pinned }));
    // время приёмов берём из текущего расписания, у съеденных — фактическое
    res.meals.forEach(function (m, i) { if (!m.eaten && schedule.meals[i]) m.time = schedule.meals[i].time; });
    return res;
  }

  /** Цель одного приёма = остаток дня после остальных приёмов (в разумных пределах от доли). */
  function slotTarget(plan, idx, daily, schedule, fm, opt) {
    const ex = (opt && opt.extraMacros) || { kcal: 0, p: 0, f: 0, c: 0 };
    const slot = schedule.meals[idx];
    const base = targetFor(daily, slot.share);
    const others = macrosOf([].concat.apply([], plan.meals.filter(function (_, i) { return i !== idx; }).map(function (m) { return m.items; })), fm);
    const rest = { kcal: daily.kcal - others.kcal - ex.kcal, p: daily.protein - others.p - ex.p, f: daily.fat - others.f - ex.f, c: daily.carbs - others.c - ex.c };
    const t = {};
    const light = rest.kcal < base.kcal * 0.5;
    ['kcal', 'p', 'f', 'c'].forEach(function (k) { t[k] = Math.min(base[k] * 1.5, Math.max(light ? (k === 'kcal' ? 0 : base[k] * 0.3) : base[k] * 0.6, rest[k])); });
    t.kcal = Math.max(150, t.kcal); t.p = Math.max(10, t.p); t.f = Math.max(3, t.f); t.c = Math.max(15, t.c);
    return { t: t, light: light, slot: slot };
  }

  function replanMeal(plan, idx, daily, schedule, inv, fm, recent, seed, opt) {
    opt = opt || {};
    const rng = mulberry32(hashStr(plan.date + ':' + idx + ':' + seed));
    const avoid = Object.assign({}, recent || {});
    plan.meals.forEach(function (m, i) { if (i !== idx && m.recipeId) avoid[m.recipeId] = (avoid[m.recipeId] || 0) + 1.5; });
    const cur = plan.meals[idx];
    if (cur.recipeId) avoid[cur.recipeId] = (avoid[cur.recipeId] || 0) + 3;
    const st = slotTarget(plan, idx, daily, schedule, fm, opt);
    const res = pickMeal(st.slot.type, st.t, inv, fm, { rng: rng, avoid: avoid, urgency: opt.urgency, dense: opt.dense, night: st.slot.night });
    return mealFromRes(st.slot, cur.time, res, st.light);
  }

  /** Поставить выбранный рецепт на приём пищи (граммовки — под остаток нормы). */
  function pinRecipe(plan, idx, recipeId, daily, schedule, inv, fm, opt) {
    opt = opt || {};
    const r = recipeById(recipeId);
    if (!r) return null;
    const st = slotTarget(plan, idx, daily, schedule, fm, opt);
    const res = fitRecipe(r, st.t, inv, fm, false, { dense: opt.dense });
    const meal = mealFromRes(st.slot, plan.meals[idx].time, res, st.light);
    meal.pinned = true;
    return meal;
  }

  /** Список покупок: прогоняем план на N дней по виртуальному складу. */
  function shoppingList(startDate, days, daily, schedule, inventory, fm, recent, opt) {
    const inv = Object.assign({}, inventory);
    const need = {};
    const rec = Object.assign({}, recent || {});
    for (let d = 0; d < days; d++) {
      const date = new Date(new Date(startDate + 'T12:00:00').getTime() + d * 864e5).toISOString().slice(0, 10);
      const plan = planDay(date, daily, schedule, inv, fm, rec, 0, true, opt);
      plan.meals.forEach(function (m) {
        m.missing.forEach(function (it) { need[it.id] = (need[it.id] || 0) + it.g; });
        if (m.recipeId) rec[m.recipeId] = (rec[m.recipeId] || 0) + 1;
      });
    }
    return Object.keys(need).map(function (id) {
      const f = fm[id];
      // округляем до удобной упаковки
      let gr = need[id];
      if (f.perUnit) gr = Math.ceil(gr / f.perUnit) * f.perUnit;
      else gr = gr < 100 ? Math.ceil(gr / 10) * 10 : Math.ceil(gr / 50) * 50;
      return { id: id, g: gr };
    }).sort(function (a, b) { return fm[a.id].cat < fm[b.id].cat ? -1 : fm[a.id].cat > fm[b.id].cat ? 1 : b.g - a.g; });
  }

  /** Калькулятор: сколько граммов выбранных продуктов съесть на приём. */
  function portionCalc(ids, target, inv, fm, limitToStock) {
    const vars = ids.map(function (id) {
      const f = fm[id];
      let hi = f.maxMeal;
      if (limitToStock) hi = Math.min(hi, inv[id] || 0);
      return { food: f, lo: 0, hi: hi, x0: hi / 3 };
    }).filter(function (v) { return v.hi > 0; });
    const x = solve(vars, target);
    const items = vars.map(function (v, i) { return { id: v.food.id, g: Math.min(v.hi, roundFood(v.food, x[i])) }; }).filter(function (it) { return it.g > 0; });
    return { items: items, macros: macrosOf(items, fm) };
  }

  NF.MEAL_SHARE = MEAL_SHARE;
  NF.MEAL_ORDER = MEAL_ORDER;
  NF.toMin = toMin;
  NF.fromMin = fromMin;
  NF.sleepMinutes = sleepMinutes;
  NF.mealSchedule = mealSchedule;
  NF.foodMap = foodMap;
  NF.allFoods = allFoods;
  NF.roundFood = roundFood;
  NF.macrosOf = macrosOf;
  NF.solve = solve;
  NF.fitRecipe = fitRecipe;
  NF.resolveRecipe = resolveRecipe;
  NF.isTitleIngredient = isTitleIngredient;
  NF.subGrams = subGrams;
  NF.pinRecipe = pinRecipe;
  NF.slotTarget = slotTarget;
  NF.pickMeal = pickMeal;
  NF.planDay = planDay;
  NF.planRest = planRest;
  NF.replanMeal = replanMeal;
  NF.shoppingList = shoppingList;
  NF.portionCalc = portionCalc;
  NF.targetFor = targetFor;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* NovaFit — генератор программы тренировок под инвентарь.
 * Принципы (ACSM Position Stand 2009 по прогрессии нагрузок; Schoenfeld 2017):
 *  • 10+ рабочих подходов на мышцу в неделю для гипертрофии;
 *  • каждая мышца 2 раза в неделю;
 *  • двойная прогрессия: сначала повторения до верха диапазона, потом
 *    усложнение. С одной гантелью без смены веса усложняем через
 *    подходы, темп, паузы и более тяжёлые вариации (одна рука/нога).
 */
(function (g) {
  const NF = (g.NF = g.NF || {});

  const TEMPLATES = {
    A: { title: 'Фулбоди A', slots: [['squat', 0], ['hpush', 0], ['hpull', 0], ['hinge', 0], ['side', 0], ['core', 0]] },
    B: { title: 'Фулбоди B', slots: [['lunge', 0], ['vpush', 0], ['vpull', 0], ['glute', 0], ['bi', 0], ['tri', 0], ['core', 1]] },
    C: { title: 'Фулбоди C', slots: [['squat', 1], ['hpush', 1], ['hpull', 0], ['hinge', 1], ['calves', 0], ['side', 0], ['core', 0]] },
    U1: { title: 'Верх 1', slots: [['hpush', 0], ['hpull', 0], ['vpush', 0], ['vpull', 0], ['side', 0], ['bi', 0], ['tri', 0]] },
    L1: { title: 'Низ 1', slots: [['squat', 0], ['hinge', 0], ['lunge', 0], ['glute', 0], ['calves', 0], ['core', 0]] },
    U2: { title: 'Верх 2', slots: [['hpush', 1], ['hpull', 0], ['vpush', 1], ['vpull', 1], ['side', 0], ['bi', 0], ['tri', 1]] },
    L2: { title: 'Низ 2', slots: [['squat', 1], ['hinge', 1], ['lunge', 1], ['glute', 1], ['calves', 0], ['core', 1]] },
  };

  const COMPOUND = { squat: 1, lunge: 1, hinge: 1, glute: 1, hpush: 1, vpush: 1, hpull: 1, vpull: 1 };

  function hasEquip(ex, eq) {
    return ex.req.every(function (r) {
      if (r === 'db') return eq.db > 0;
      return !!eq[r];
    });
  }

  /** Насколько упражнение подходит под имеющуюся гантель (меньше — лучше). */
  function suitability(ex, eq) {
    if (!ex.kg) return ex.kind === 'bw' || ex.kind === 'time' ? 1.0 : 0.5; // свой вес — запасной вариант
    const kg = eq.dbKg || 0;
    if (kg > ex.kg[1] && !eq.adjustable) return Infinity; // слишком тяжело — небезопасно
    if (kg >= ex.kg[0]) return 0;
    return 0.3 + (ex.kg[0] - kg) / Math.max(1, ex.kg[0]); // легковато — подойдёт, но хуже
  }

  function candidates(slot, eq) {
    return NF.EXERCISES.filter(function (ex) { return ex.slot === slot && hasEquip(ex, eq); })
      .map(function (ex) { return { ex: ex, s: suitability(ex, eq) }; })
      .filter(function (c) { return isFinite(c.s); })
      .sort(function (a, b) { return a.s - b.s; });
  }

  /** Подбор подходов/повторений. Лёгкая гантель → больше повторений + медленный темп. */
  function prescribe(ex, eq, level) {
    const compound = !!COMPOUND[ex.slot];
    let sets = level === 'intermediate' ? (compound ? 4 : 3) : 3;
    let lo = ex.reps[0], hi = ex.reps[1];
    let tempo = null;
    if (ex.kg && !eq.adjustable && eq.dbKg < ex.kg[0]) {
      lo = Math.min(lo + 5, 20); hi = Math.min(hi + 8, 25);
      tempo = '3 секунды вниз, пауза 1 секунда: компенсируем лёгкую гантель';
    }
    const rest = ex.slot === 'core' ? 45 : compound ? 90 : 60;
    return { sets: sets, lo: lo, hi: hi, tempo: tempo, rest: rest, unit: ex.kind === 'time' ? 'сек' : 'повт.' };
  }

  function splitFor(daysPerWeek) {
    if (daysPerWeek >= 4) return ['U1', 'L1', 'U2', 'L2'];
    if (daysPerWeek === 3) return ['A', 'B', 'C'];
    return ['A', 'B'];
  }

  function buildWorkout(key, eq, level) {
    const tpl = TEMPLATES[key];
    const used = {};
    const items = [];
    tpl.slots.forEach(function (sv) {
      const list = candidates(sv[0], eq).filter(function (c) { return !used[c.ex.id]; });
      if (!list.length) return;
      // вариант 1 = второе по пригодности упражнение (если не сильно хуже)
      let c = list[0];
      if (sv[1] === 1 && list[1] && list[1].s <= list[0].s + 1.1) c = list[1];
      used[c.ex.id] = 1;
      items.push(Object.assign({ id: c.ex.id, slot: sv[0] }, prescribe(c.ex, eq, level)));
    });
    return { key: key, title: tpl.title, items: items };
  }

  function buildProgram(eq, level, daysPerWeek) {
    const keys = splitFor(daysPerWeek);
    return keys.map(function (k) { return buildWorkout(k, eq, level); });
  }

  /** Рекомендация по прогрессии на основе последнего выполнения. */
  function progression(item, history, eq) {
    const ex = NF.EXERCISES.find(function (e) { return e.id === item.id; });
    const last = [];
    for (let i = history.length - 1; i >= 0 && last.length < 2; i--) {
      const s = history[i].sets && history[i].sets[item.id];
      if (s && s.length) last.push(s);
    }
    if (!last.length) return { status: 'new', text: 'Первый раз: подбери темп так, чтобы 1–2 повтора оставались в запасе.' };
    const reps = last[0];
    const allTop = reps.length >= item.sets && reps.every(function (r) { return r >= item.hi; });
    const anyLow = reps.some(function (r) { return r < item.lo; });
    if (allTop) {
      let how;
      if (eq.adjustable) how = 'добавь 1–2 кг';
      else if (item.sets < 5 && ex.slot !== 'core') how = 'добавь подход (до 5) или переходи к усложнению: ' + ex.harder.toLowerCase();
      else how = ex.harder;
      return { status: 'up', text: 'Верх диапазона во всех подходах. Пора усложнять: ' + how + '.' };
    }
    if (anyLow && last[1] && last[1].some(function (r) { return r < item.lo; })) {
      return { status: 'hold', text: 'Две тренировки ниже диапазона. Отдохни подольше между подходами, проверь сон и калории.' };
    }
    const sum = reps.reduce(function (a, b) { return a + b; }, 0);
    return { status: 'keep', text: 'Прошлый раз: ' + reps.join(' / ') + ' (всего ' + sum + '). Цель: +1 повтор хотя бы в одном подходе.' };
  }

  const WARMUP = [
    '3–5 минут: ходьба на месте, джампинг-джеки или скакалка',
    'Вращения в плечах, тазе, коленях: по 10 в каждую сторону',
    '10 приседаний без веса и 5–10 отжиманий от дивана',
    'Первое упражнение: 1 разминочный подход на 50 % усилия',
  ];
  const COOLDOWN = [
    'Растяжка груди в дверном проёме: 30 секунд',
    'Растяжка квадрицепса и задней поверхности бедра: по 30 секунд',
    'Медленное дыхание лёжа: 1 минута',
  ];

  NF.TEMPLATES = TEMPLATES;
  NF.buildProgram = buildProgram;
  NF.buildWorkout = buildWorkout;
  NF.splitFor = splitFor;
  NF.progression = progression;
  NF.exerciseCandidates = candidates;
  NF.WARMUP = WARMUP;
  NF.COOLDOWN = COOLDOWN;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* NovaFit — аналитика и напоминания (чистые функции, без DOM).
 *  • weekReport   — недельный отчёт и главный совет;
 *  • measureInsight — что говорят замеры тела;
 *  • reminderEvents — напоминания на день;
 *  • buildICS     — файл календаря с повторяющимися напоминаниями.
 */
(function (g) {
  const NF = (g.NF = g.NF || {});

  function addDays(date, n) {
    const d = new Date(date + 'T12:00:00');
    d.setDate(d.getDate() + n);
    const z = (x) => (x < 10 ? '0' : '') + x;
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  }
  function weekday(date) { return new Date(date + 'T12:00:00').getDay(); }
  /** Понедельник недели, в которую входит дата. */
  function weekStart(date) { const wd = weekday(date); return addDays(date, wd === 0 ? -6 : 1 - wd); }
  function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }
  const avg = (arr) => (arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null);

  /** Что съедено за день: отмеченные приёмы + еда вне плана. */
  function dayIntake(plan, extras, fm) {
    const items = [];
    let n = 0;
    if (plan) plan.meals.forEach((m) => { if (m.eaten) { n++; items.push.apply(items, m.items); } });
    (extras || []).forEach((x) => { n++; items.push(x); });
    return { macros: NF.macrosOf(items, fm), logged: n > 0 };
  }

  /**
   * Недельный отчёт. d = { start, today, plans, extras, weights, sleepLog,
   * workouts, trainDays, profile, targets, fm, measures }
   */
  function weekReport(d) {
    const T = d.targets;
    const end = addDays(d.start, 6);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const date = addDays(d.start, i);
      if (date > d.today) { days.push({ date: date, status: 'future', kcal: 0, p: 0, target: T.kcal }); continue; }
      const plan = d.plans[date];
      const intake = dayIntake(plan, d.extras[date], d.fm);
      const target = plan && plan.kcal ? plan.kcal : T.kcal;
      let status = 'none';
      if (intake.logged) status = intake.macros.kcal >= target * 0.9 ? 'ok' : 'low';
      days.push({ date: date, status: status, kcal: Math.round(intake.macros.kcal), p: Math.round(intake.macros.p), target: target });
    }
    const past = days.filter((x) => x.status !== 'future');
    const logged = days.filter((x) => x.status === 'ok' || x.status === 'low');
    const okDays = days.filter((x) => x.status === 'ok').length;
    const avgKcal = avg(logged.map((x) => x.kcal));
    const avgP = avg(logged.map((x) => x.p));
    const avgTarget = avg(logged.map((x) => x.target));

    // вес: средний за неделю против среднего за прошлую (это сглаживает колебания воды)
    const inRange = (a, b) => d.weights.filter((w) => w.date >= a && w.date <= b).map((w) => w.kg);
    const wk = inRange(d.start, end), prev = inRange(addDays(d.start, -7), addDays(d.start, -1));
    let weightDelta = null, weightBasis = null;
    if (wk.length && prev.length) { weightDelta = avg(wk) - avg(prev); weightBasis = 'avg'; }
    else if (wk.length >= 2) { weightDelta = wk[wk.length - 1] - wk[0]; weightBasis = 'range'; }

    const teen = d.profile.age < 18;
    const sleepNeed = teen ? 480 : 420;
    const sl = d.sleepLog.filter((e) => e.date >= d.start && e.date <= end).map((e) => NF.sleepMinutes(e.bed, e.wake));
    const sleepAvg = avg(sl);
    const sleepShort = sl.filter((m) => m < sleepNeed).length;

    const workoutsDone = d.workouts.filter((w) => w.date >= d.start && w.date <= end).length;
    const workoutsPlanned = past.filter((x) => d.trainDays.indexOf(weekday(x.date)) >= 0).length;
    const measured = (d.measures || []).some((m) => m.date >= d.start && m.date <= end);

    // советы — от самого важного
    const advice = [];
    const plan = T.weekly;
    const complete = d.today > end; // неделя закончилась
    if (past.length >= 3 && logged.length < Math.ceil(past.length / 2)) {
      advice.push({ level: 'warn', text: 'Отмечено только ' + logged.length + ' из ' + past.length + ' дней. Нажимай «Съел» и добавляй еду вне плана, иначе отчёт и автоподстройка калорий работают вслепую.' });
    }
    if (weightDelta != null && complete && weightDelta < plan * 0.5) {
      if (logged.length && okDays < logged.length * 0.7) {
        advice.push({ level: 'warn', text: 'Вес почти не растёт (' + fmtKg(weightDelta) + ' при плане +' + plan + ' кг), и норма закрыта только в ' + okDays + ' ' + plural(okDays, 'день', 'дня', 'дней') + '. Главное сейчас — добирать калории: гейнер-коктейль на перекус, орехи и арахисовая паста, масло в гарнир.' });
      } else {
        advice.push({ level: 'info', text: 'Норму закрываешь, но вес растёт медленно (' + fmtKg(weightDelta) + '). Значит, расход выше расчётного. Автоподстройка добавит +100 ккал, ничего менять не нужно.' });
      }
    }
    if (weightDelta != null && complete && weightDelta > Math.max(0.3, plan * 1.5)) {
      advice.push({ level: 'warn', text: 'Слишком быстро: ' + fmtKg(weightDelta) + ' за неделю при плане +' + plan + ' кг. Лишнее уходит в жир. Автоподстройка уберёт 100 ккал. Если повторится, переключи темп на «Плавно».' });
    }
    if (avgP != null && avgP < d.targets.protein * 0.85) {
      advice.push({ level: 'warn', text: 'Белка в среднем ' + Math.round(avgP) + ' г из ' + d.targets.protein + ' г. Без белка калории идут в жир. Добавь творог, яйца или протеин на перекус.' });
    }
    if (sleepAvg != null && sleepAvg < sleepNeed) {
      advice.push({ level: 'warn', text: 'Сон в среднем ' + fmtDur(sleepAvg) + '. Недосып снижает долю мышц в наборе. Ложись на 30 минут раньше.' });
    }
    if (workoutsPlanned >= 2 && workoutsDone < workoutsPlanned - 1) {
      advice.push({ level: 'warn', text: 'Тренировок ' + workoutsDone + ' из ' + workoutsPlanned + '. Без нагрузки профицит калорий превращается в жир, а не в мышцы. Если не успеваешь, оставь 2 дня в неделю, но не пропускай их.' });
    }
    if (!advice.length) {
      advice.push({ level: 'ok', text: logged.length ? 'Хорошая неделя: калории, сон и тренировки в норме. Продолжай в том же ритме.' : 'Неделя только началась. Отмечай еду, сон и тренировки, и здесь появится разбор.' });
    }

    return {
      start: d.start, end: end, complete: complete, days: days,
      loggedDays: logged.length, pastDays: past.length, okDays: okDays,
      avgKcal: avgKcal, avgTarget: avgTarget, avgP: avgP, proteinTarget: d.targets.protein,
      weightDelta: weightDelta, weightBasis: weightBasis, plannedWeekly: plan,
      sleepAvg: sleepAvg, sleepShort: sleepShort, sleepNights: sl.length, sleepNeed: sleepNeed,
      workoutsDone: workoutsDone, workoutsPlanned: workoutsPlanned, measured: measured,
      advice: advice,
    };
  }

  function fmtKg(x) { return (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(2).replace('.', ',') + ' кг'; }
  function fmtDur(min) { min = Math.round(min); const h = Math.floor(min / 60), m = min % 60; return h + ' ч' + (m ? ' ' + m + ' мин' : ''); }
  function plural(n, a, b, c) { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }

  // ───────── замеры ─────────
  const MEASURES = [
    { k: 'waist', label: 'Талия', how: 'На уровне пупка, живот расслаблен, на выдохе' },
    { k: 'chest', label: 'Грудь', how: 'По самой широкой части, через соски, руки опущены' },
    { k: 'arm', label: 'Бицепс', how: 'Самая широкая часть плеча, рука напряжена и согнута' },
    { k: 'thigh', label: 'Бедро', how: 'Самая широкая часть, стоя, нога расслаблена' },
  ];

  function weightNear(weights, date) {
    let best = null, bd = 8;
    weights.forEach((w) => { const dd = Math.abs(daysBetween(w.date, date)); if (dd < bd) { bd = dd; best = w.kg; } });
    return best;
  }

  /**
   * Сравнение первого и последнего замера. Ориентир (не точная наука):
   * при наборе мышц талия растёт заметно медленнее веса, примерно до 1 см на
   * каждый набранный кг. Если талия растёт быстрее, набирается много жира.
   */
  function measureInsight(measures, weights) {
    const ms = (measures || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    if (ms.length < 2) return { verdict: { level: 'info', text: 'Сделай замеры сейчас и повтори через 2 недели. По разнице станет видно, что растёт: мышцы или жир.' } };
    const first = ms[0], last = ms[ms.length - 1];
    const deltas = {};
    MEASURES.forEach((m) => { if (first[m.k] != null && last[m.k] != null) deltas[m.k] = +(last[m.k] - first[m.k]).toFixed(1); });
    const w0 = weightNear(weights, first.date), w1 = weightNear(weights, last.date);
    const dW = w0 != null && w1 != null ? +(w1 - w0).toFixed(1) : null;
    const days = daysBetween(first.date, last.date);
    let verdict;
    if (days < 10) verdict = { level: 'info', text: 'Между замерами меньше 10 дней: разница пока в пределах погрешности сантиметра.' };
    else if (dW == null || deltas.waist == null) verdict = { level: 'info', text: 'Для вывода нужны вес и талия на даты замеров.' };
    else if (dW < 1) verdict = { level: 'info', text: 'С первого замера вес изменился на ' + dW.toString().replace('.', ',') + ' кг. Для вывода нужна прибавка хотя бы 1 кг.' };
    else {
      const ratio = deltas.waist / dW;
      const armUp = deltas.arm != null && deltas.arm > 0;
      if (ratio <= 0.7) verdict = { level: 'ok', text: 'Отлично: +' + dW + ' кг, а талия +' + deltas.waist + ' см. Набираешь в основном мышцы' + (armUp ? ', бицепс растёт' : '') + '.' };
      else if (ratio <= 1.3) verdict = { level: 'ok', text: 'Нормальный набор: на каждый килограмм талия прибавляет около ' + ratio.toFixed(1).replace('.', ',') + ' см. Жира немного, это ожидаемо.' };
      else verdict = { level: 'warn', text: 'Талия растёт быстро: ' + ratio.toFixed(1).replace('.', ',') + ' см на каждый набранный кг. Похоже, растёт в основном жир. Переключи темп на «Плавно» в профиле и проверь, что не пропускаешь тренировки.' };
    }
    return { first: first, last: last, deltas: deltas, dW: dW, days: days, verdict: verdict };
  }

  // ───────── напоминания ─────────
  /**
   * События на дату. ctx = { date, meals:[{type,time,eaten,title}], bed, wake,
   * trainTime|null, lead, opts:{meals,sleep,train,weigh,measure}, measureDue }
   */
  function reminderEvents(ctx) {
    const ev = [];
    const at = (hhmm, minus) => NF.fromMin(NF.toMin(hhmm) - (minus || 0));
    const o = ctx.opts;
    if (o.meals) ctx.meals.forEach((m, i) => {
      if (m.eaten) return;
      const label = m.label || NF.MEAL_LABEL[m.type];
      ev.push({ key: 'meal-' + i + m.type, at: at(m.time, ctx.lead), title: label + ' в ' + m.time, body: m.title || 'Открой NovaFit: там блюдо и граммовки' });
    });
    if (o.train && ctx.trainTime) ev.push({ key: 'train', at: at(ctx.trainTime, 60), title: 'Тренировка через час', body: 'Перекус был? Подготовь воду и гантель.' });
    if (o.sleep) ev.push({ key: 'sleep', at: at(ctx.bed, 30), title: 'Через 30 минут отбой', body: 'Отложи телефон, проветри комнату. Сон — это время роста мышц.' });
    const wd = weekday(ctx.date);
    if (o.weigh && (wd === 1 || wd === 4)) ev.push({ key: 'weigh', at: at(ctx.wake, -10), title: 'Взвешивание', body: 'Утром натощак, после туалета. Запиши вес в профиле.' });
    if (o.measure && ctx.measureDue) ev.push({ key: 'measure', at: at(ctx.wake, -20), title: 'Пора сделать замеры', body: 'Талия, грудь, бицепс, бедро: прошло 2 недели.' });
    return ev.sort((a, b) => (a.at < b.at ? -1 : 1));
  }

  // ───────── календарь (.ics) ─────────
  const BYDAY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
  /** Перенос длинных строк по 75 байт (RFC 5545), не разрывая символы. */
  function fold(line) {
    const out = [];
    let cur = '', bytes = 0;
    for (const ch of line) {
      const b = unescape(encodeURIComponent(ch)).length;
      if (bytes + b > (out.length ? 74 : 75)) { out.push(cur); cur = ''; bytes = 0; }
      cur += ch; bytes += b;
    }
    out.push(cur);
    return out.join('\r\n ');
  }
  function icsDate(date, hhmm) { return date.replace(/-/g, '') + 'T' + hhmm.replace(':', '') + '00'; }
  function firstOnDays(start, days) { for (let i = 0; i < 7; i++) { const d = addDays(start, i); if (days.indexOf(weekday(d)) >= 0) return d; } return start; }

  /**
   * c = { start, lead, opts, wake, bed, trainDays, trainTime, schedRest, schedTrain, stamp }
   * schedRest/schedTrain — расписания еды (NF.mealSchedule) для дней без и с тренировкой.
   */
  function buildICS(c) {
    const all = [0, 1, 2, 3, 4, 5, 6];
    const rest = all.filter((d) => c.trainDays.indexOf(d) < 0);
    const events = [];
    let uid = 0;
    function add(title, body, days, time, durMin, alarmMin, interval) {
      if (!days.length) return;
      const dstart = firstOnDays(c.start, days);
      const endMin = NF.toMin(time) + durMin;
      const endDate = endMin >= 1440 ? addDays(dstart, 1) : dstart;
      const rrule = days.length === 7 && !interval ? 'RRULE:FREQ=DAILY' : 'RRULE:FREQ=WEEKLY' + (interval ? ';INTERVAL=' + interval : '') + ';BYDAY=' + days.map((d) => BYDAY[d]).join(',');
      events.push([
        'BEGIN:VEVENT',
        'UID:novafit-' + (++uid) + '-' + c.start.replace(/-/g, '') + '@novafit.app',
        'DTSTAMP:' + c.stamp,
        'DTSTART:' + icsDate(dstart, time),
        'DTEND:' + icsDate(endDate, NF.fromMin(endMin)),
        rrule,
        'SUMMARY:' + icsEsc(title),
        'DESCRIPTION:' + icsEsc(body),
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(title), 'TRIGGER:-PT' + alarmMin + 'M', 'END:VALARM',
        'END:VEVENT',
      ].map(fold).join('\r\n'));
    }
    const o = c.opts;
    if (o.meals) {
      // одинаковые по времени приёмы в днях с тренировкой и без объединяем
      c.schedRest.meals.forEach((m, i) => {
        const mt = c.schedTrain.meals[i] || m;
        const body = 'Блюдо и граммовки в NovaFit.';

    [/couscous/, 'couscous'],
    [/quinoa/, 'quinoa'],
    [/bulgur/, 'bulgur'],
    [/buckwheat/, 'buckwheat'],

    [/semi-skimmed-milk|^milks$|cow-milk|uht-milk|pasteuri[sz]ed-milk/, 'milk'],
    [/^butters$|salted-butter|unsalted-butter|dairy-butter|sweet-cream-butter/, 'butter'],
    [/olive-oil/, 'olive_oil'],
    [/sunflower-oil|vegetable-oil|rapeseed-oil|canola-oil/, 'sunflower_oil'],
    [/hard-chees|cheddar|gouda|emmental|edam|parmigiano|parmesan/, 'cheese'],
    [/^peanuts$|roasted-peanuts/, 'peanuts'],
    [/^almonds$|whole-almonds/, 'almonds'],
    [/^walnuts$|walnut-kernels/, 'walnuts'],
    [/cashew/, 'cashews'],
    [/^raisins$|sultanas/, 'raisins'],
    [/dried-apricot/, 'dried_apricots'],
    [/^dates$|medjool|deglet/, 'dates'],
    [/^honeys$|^honey$/, 'honey'],
    [/tuna/, 'tuna_can'],
    [/chickpea/, 'chickpeas_can'],
    [/lentil/, 'lentils'],
    [/kidney-beans|black-beans|white-beans|canned-beans|^beans$/, 'beans_can'],
    [/sweet-corn|canned-corn/, 'corn_can'],
    [/tomato-paste|tomato-concentrate/, 'tomato_paste'],

    video.muted = true;

    let detector = null;
    if ('BarcodeDetector' in g) {
      try {
        const fmts = await g.BarcodeDetector.getSupportedFormats();
        const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e'].filter(function (f) { return fmts.indexOf(f) >= 0; });
        if (want.length) detector = new g.BarcodeDetector({ formats: want });
      } catch (e) { detector = null; }
    }
    if (!detector) {
      try { await loadZXing(); } catch (e) { stream.getTracks().forEach(function (t) { t.stop(); }); throw new Error('nodecoder'); }
    }

    const ctx = canvas.getContext('2d', { willReadFrequently: true });

      stopped = true;
      clearTimeout(timer);
      stream.getTracks().forEach(function (t) { t.stop(); });
      video.srcObject = null;
    }
    async function tick() {
      if (stopped) return;
      if (!busy && video.readyState >= 2 && video.videoWidth) {
        busy = true;
        try {
          let code = null;
          if (detector) {
            const r = await detector.detect(video);
            if (r && r.length) code = r[0].rawValue;
          } else {
            // средняя полоса кадра — там рамка; уменьшаем для скорости

            const w = Math.min(vw, 960), h = Math.round((vh * 0.5) * (w / vw));

            last = code;

          }

  let S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

  const ui = { open: {}, noticesAll: false, recMore: {}, profSeg: 'norm', recQuery: '', recTime: 0, recNoCook: false, waterOpen: false, extraOpen: false, extraSearch: '', extraPick: null, editExp: null, reportWeek: 0, measureOpen: false, foodSeg: 'stock', search: '', addFood: null, calcSel: [], calcMeal: 'l', calcStock: true, recFilter: 'all', shopDays: 3, shopChecked: {}, confirmReset: false, customOpen: false, importOpen: false, errors: [] };

  // ───────────────── утилиты ─────────────────
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r0 = (n) => Math.round(n);
  const fm = () => NF.foodMap(S.customFoods);
  const recipeById = (id) => NF.RECIPES.find((r) => r.id === id);
  const exById = (id) => NF.EXERCISES.find((e) => e.id === id);
  function fmtDate(date, opts) {
    return new Intl.DateTimeFormat('ru-RU', opts || { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(date + 'T12:00:00'));
  }
  function fmtDur(min) { const h = Math.floor(min / 60), m = min % 60; return h + ' ч' + (m ? ' ' + m + ' мин' : ''); }
  function qtyLabel(food, g) {
    const u = LIQUID[food.id] ? 'мл' : 'г';
    let s = r0(g) + ' ' + u;
    if (food.perUnit && food.unit) {
      const n = g / food.perUnit;
      const nn = Math.abs(n - Math.round(n)) < 0.05 ? Math.round(n) : n.toFixed(1).replace('.', ',');
      s += ' · ' + nn + ' ' + food.unit;
    }
    return s;
  }
  function plural(n, a, b, c) { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }

  function targets() { return S.profile ? NF.calcTargets(S.profile, S.calAdjust) : null; }

  function isTrainDay(date) { return S.train.days.indexOf(new Date(date + 'T12:00:00').getDay()) >= 0; }

  function sleepEntry(date) { return S.sleep.log.find((e) => e.date === date); }

  function scheduleFor(date) {
    const e = sleepEntry(date);
    const wake = e ? e.wake : S.sleep.wake;
    return NF.mealSchedule(wake, S.sleep.bed, isTrainDay(date) ? S.train.time : null, S.lowAppetite ? 'six' : 'four');
  }
  const mealLabel = (m) => m.label || NF.MEAL_LABEL[m.type];

  function recentPenalty(date) {
    const pen = {};
    [1, 2].forEach((back) => {
      const p = S.plans[addDays(date, -back)];
      if (p) p.meals.forEach((m) => { if (m.recipeId) pen[m.recipeId] = (pen[m.recipeId] || 0) + (back === 1 ? 1.2 : 0.6); });
    });
    return pen;
  }

  // ── сроки годности ──
  function daysLeft(id) {
    const e = S.expiry[id];
    return e ? NF.daysBetween(todayStr(), e) : null;
  }
  /** Запасы для планирования: просроченное в меню не попадает. */
  function usableInventory() {
    const inv = {};
    Object.keys(S.inventory).forEach((id) => { const d = daysLeft(id); if (d == null || d >= 0) inv[id] = S.inventory[id]; });
    return inv;
  }
  /** Насколько срочно доесть продукт: 1 — сегодня/завтра, 0,6 — 2–3 дня. */
  function urgencyMap() {
    const u = {};
    Object.keys(S.inventory).forEach((id) => { const d = daysLeft(id); if (d != null && d >= 0) u[id] = d <= 1 ? 1 : d <= 3 ? 0.6 : 0; });
    return u;
  }
  function setExpiryOnAdd(id, date) {
    if (!date) return;
    // если дома уже есть такой продукт со сроком раньше — оставляем более ранний (безопаснее)
    if (!S.expiry[id] || (S.inventory[id] || 0) <= 0 || date < S.expiry[id]) S.expiry[id] = date;
  }
  function suggestExpiry(id) { const d = NF.SHELF[id]; return d ? addDays(todayStr(), d) : ''; }

  // ── еда вне плана ──
  function extrasFor(date) { return S.extras[date] || []; }
  function extraMacros(date) { return NF.macrosOf(extrasFor(date), fm()); }

  function planOpts(date) { return { urgency: urgencyMap(), extraMacros: extraMacros(date), dense: !!S.lowAppetite }; }

  /**
   * Переключили режим питания (4 ↔ 6 приёмов): строим новый план, съеденное
   * сохраняем. Если съеденному приёму не нашлось места в новом расписании,
   * он уходит в «еду вне плана» — ничего не теряется.
   */
  function rebuildForMode() {
    const date = todayStr();
    const old = S.plans[date];
    const fresh = buildPlan(date, old ? old.seed || 0 : 0);
    S.plans[date] = fresh;
    if (old) {
      const used = {};
      let placed = 0;
      old.meals.filter((m) => m.eaten).forEach((m) => {
        let best = -1, bd = 1e9;
        fresh.meals.forEach((f, i) => {
          if (used[i] || f.type !== m.type) return;
          const d = Math.abs(NF.toMin(f.time) - NF.toMin(m.time));
          if (d < bd) { bd = d; best = i; }
        });
        if (best >= 0) {
          used[best] = 1; placed++;
          fresh.meals[best] = Object.assign({}, m, { label: fresh.meals[best].label, night: fresh.meals[best].night });
        } else {
          const xs = (S.extras[date] = S.extras[date] || []);
          m.items.forEach((it) => xs.push({ id: it.id, g: it.g, t: m.time, stock: false }));
        }
      });
      if (placed || extrasFor(date).length) rebuildPlan(date);
    }
    save();
  }

  function buildPlan(date, seed) {
    const T = targets();
    const plan = NF.planDay(date, T, scheduleFor(date), usableInventory(), fm(), recentPenalty(date), seed || 0, false, planOpts(date));
    plan.invVersion = S.invVersion;
    plan.kcal = T.kcal;
    return plan;
  }

  function getPlan(date) {
    if (!S.plans[date]) {
      S.plans[date] = buildPlan(date, 0);
      // храним планы только за последние 21 день
      Object.keys(S.plans).forEach((d) => { if (d < addDays(date, -21)) delete S.plans[d]; });
      save();
    }
    return S.plans[date];
  }

  /** Пересобрать несъеденные приёмы: съеденные и еда вне плана учитываются. */
  function rebuildPlan(date, newSeed) {
    const old = getPlan(date);
    const T = targets();
    const seed = newSeed ? (old.seed || 0) + 1 : old.seed || 0;
    const fresh = NF.planRest(old, T, scheduleFor(date), usableInventory(), fm(), recentPenalty(date), seed, planOpts(date));
    fresh.invVersion = S.invVersion;
    fresh.kcal = T.kcal;
    fresh.swaps = old.swaps || 0;
    S.plans[date] = fresh;
    save();
  }

  /** Всё съеденное за день: отмеченные приёмы + еда вне плана. */
  function eatenMacros(plan) {
    return NF.dayIntake(plan, extrasFor(plan.date), fm()).macros;
  }

  function changeInventory(id, delta) {
    const cur = S.inventory[id] || 0;
    const next = Math.max(0, cur + delta);
    if (next <= 0) { delete S.inventory[id]; delete S.expiry[id]; } else S.inventory[id] = next;
    S.invVersion++;
  }

  function toast(msg, ms) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toast._t); clearTimeout(toast._h);
    requestAnimationFrame(() => t.classList.add('show'));
    toast._t = setTimeout(() => {
      t.classList.remove('show');
      toast._h = setTimeout(() => { t.hidden = true; }, 260);
    }, ms || 2600);
  }

  function runAdaptation() {
    const T = targets();
    if (!T) return;
    const res = NF.adaptCalories(S.weights, T.weekly, todayStr(), S.calAdjust, S.lastAdjust);
    if (res.rate != null) {
      // проверка состоялась — следующая не раньше чем через 7 дней
      S.adaptMsg = res.reason;
      S.calAdjust = res.adjust;
      S.lastAdjust = todayStr();
    } else if (res.reason) {
      S.adaptMsg = res.reason;
    }
  }

  // ───────────────── компоненты ─────────────────
  function macroLine(m, cls) {
    return '<span class="macros ' + (cls || '') + '"><b>' + r0(m.kcal) + '</b> ккал · Б ' + r0(m.p) + ' · Ж ' + r0(m.f) + ' · У ' + r0(m.c) + '</span>';
  }

  function bar(label, val, max, unit, mod) {
    const pct = Math.max(0, Math.min(100, (val / Math.max(1, max)) * 100));
    const key = 'bar-' + (mod || label);
    return '<div class="bar ' + (mod || '') + '"><div class="bar-top"><span>' + label + '</span><span class="num">' + r0(val) + ' / ' + r0(max) + ' ' + unit + '</span></div>' +
      '<div class="bar-track"><div class="bar-fill" data-k="' + key + '" data-w="' + pct.toFixed(1) + '" style="width:' + pct.toFixed(1) + '%"></div></div></div>';
  }

  function ring(val, max) {
    const pct = Math.max(0, Math.min(1, val / Math.max(1, max)));
    const R = 52, C = 2 * Math.PI * R;
    return '<svg class="ring" viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="' + R + '" class="ring-bg"/>' +
      '<circle cx="64" cy="64" r="' + R + '" class="ring-fg" data-k="ring" data-dash="' + (C * pct).toFixed(1) + '" data-c="' + C.toFixed(1) + '" stroke-dasharray="' + (C * pct).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 64 64)"/></svg>';
  }

  function warningsBlock(ws) {
    if (!ws || !ws.length) return '';
    return ws.map((w) => '<div class="note note-' + w.level + '">' + esc(w.text) + '</div>').join('');
  }

  // ───────────────── вкладка «Сегодня» ─────────────────
  function renderToday() {
    if (!S.profile) return renderOnboarding();
    const date = todayStr();
    const T = targets();
    const plan = getPlan(date);
    const eaten = eatenMacros(plan);
    const F = fm();
    const stale = plan.invVersion !== S.invVersion || Math.abs(plan.kcal - T.kcal) > T.kcal * 0.03;
    const sl = sleepEntry(date);
    const train = isTrainDay(date);
    const program = currentProgram();
    const next = program[S.workouts.length % program.length];
    const doneToday = S.workouts.some((w) => w.date === date);
    const lastW = S.weights.length ? S.weights[S.weights.length - 1].kg : S.profile.weight;
    const start = S.startWeight || S.profile.weight;
    const prog = Math.max(0, Math.min(1, (lastW - start) / Math.max(0.1, S.profile.target - start)));
    const closed = eaten.kcal >= T.kcal * 0.97;

    let html = '<section class="hero">' +
      '<p class="eyebrow">' + esc(fmtDate(date)) + '</p>' +
      '<div class="hero-row">' +
      '<div class="ring-wrap">' + ring(eaten.kcal, T.kcal) + '<div class="ring-label"><span class="ring-num count" data-k="kcal" data-n="' + r0(eaten.kcal) + '">' + r0(eaten.kcal) + '</span><span class="ring-sub">' + (closed ? 'норма закрыта ✓' : 'из ' + T.kcal + ' ккал') + '</span></div></div>' +
      '<div class="hero-bars">' +
      bar('Белки', eaten.p, T.protein, 'г', 'p') + bar('Жиры', eaten.f, T.fat, 'г', 'f') + bar('Углеводы', eaten.c, T.carbs, 'г', 'c') +
      '</div></div>' +
      '<div class="goal"><div class="goal-top"><span>' + lastW.toFixed(1).replace('.', ',') + ' кг</span><span class="muted">цель ' + S.profile.target + ' кг · ~' + T.weeks + ' ' + plural(T.weeks, 'неделя', 'недели', 'недель') + '</span></div>' +
      '<div class="bar-track thin"><div class="bar-fill goal-fill" data-k="goal" data-w="' + (prog * 100).toFixed(1) + '" style="width:' + (prog * 100).toFixed(1) + '%"></div></div></div>' +
      '</section>';

    html += '<div class="chips-row">' +
      '<button class="chip-card" data-act="tab" data-tab="sleep"><span class="chip-k">Сон</span><span class="chip-v">' + (sl ? fmtDur(NF.sleepMinutes(sl.bed, sl.wake)) : 'отметить') + '</span></button>' +
      '<button class="chip-card" data-act="tab" data-tab="train"><span class="chip-k">' + (train ? 'Тренировка' : 'Отдых') + '</span><span class="chip-v">' + (train ? (doneToday ? 'готово ✓' : S.train.time) : 'восстановление') + '</span></button>' +
      '<button class="chip-card" data-act="water-toggle" aria-expanded="' + ui.waterOpen + '"><span class="chip-k">Вода</span><span class="chip-v">' + ((train ? T.waterTrain : T.water) / 1000).toFixed(1).replace('.', ',') + ' л</span></button>' +
      '</div>';
    if (ui.waterOpen) html += waterCard(T, train);
    html += noticesBlock(notices(plan, stale));

    html += '<div class="section-head"><h2 class="h2">Еда</h2>' +
      (S.lowAppetite ? '<button class="tag-btn" data-act="open-appetite">нет аппетита</button>' : '') +
      '<button class="btn small ghost" data-act="extra-toggle" aria-expanded="' + ui.extraOpen + '">' + (ui.extraOpen ? 'Скрыть' : '+ Добавить еду') + '</button></div>';
    if (ui.extraOpen) html += extraPanel();
    html += extrasList(date);

    const nowIdx = currentMealIndex(plan);
    const preIdx = train && !doneToday ? preTrainIndex(plan) : -1;
    html += '<ol class="timeline">' + plan.meals.map((m, i) => mealCard(m, i, plan, F, i === nowIdx, i === preIdx)).join('') + '</ol>';
    return html;
  }

  /** Перекус перед тренировкой (за 0–2,5 ч до неё) — помечаем тегом. */
  function preTrainIndex(plan) {
    const tt = NF.toMin(S.train.time);
    if (tt == null) return -1;
    let idx = -1;
    plan.meals.forEach((m, i) => { const t = NF.toMin(m.time); if (m.type === 's' && t < tt && tt - t <= 150) idx = i; });
    return idx;
  }

  /**
   * Карточка приёма пищи. Свёрнуто: блюдо, калории и 2–3 главных продукта.
   * Раскрыто: все граммовки, рецепт и «Другой вариант». Текущий приём раскрыт сам.
   */
  function mealCard(m, i, plan, F, isNow, isPre) {
    const rec = m.recipeId ? recipeById(m.recipeId) : null;
    const mm = NF.macrosOf(m.items, F);
    const title = rec ? rec.name : 'Тарелка из твоих продуктов';
    const key = 'meal-' + plan.date + '-' + i;
    const open = ui.open[key] != null ? ui.open[key] : isNow && !m.eaten;
    const main = m.items.filter((it) => F[it.id] && F[it.id].cat !== 'fat').slice(0, 3);
    const sum = main.map((it) => shortName(F[it.id]) + ' ' + r0(it.g) + (LIQUID[it.id] ? ' мл' : ' г')).join(' · ') + (m.items.length > main.length ? ' · …' : '');
    const tags = (isNow ? '<span class="now-tag">сейчас</span>' : '') +
      (isPre ? '<span class="tag">до тренировки</span>' : '') +
      (m.night ? '<span class="tag">перед сном</span>' : '') +
      (m.missing.length && !m.eaten ? '<span class="tag warn">надо купить</span>' : '');

    let detail = macroLine(mm) + '<ul class="items">' + m.items.map((it) => {
      const f = F[it.id]; if (!f) return '';
      const miss = m.missing.find((x) => x.id === it.id);
      const dl = daysLeft(it.id);
      const urgent = !m.eaten && dl != null && dl >= 0 && dl <= 1;
      return '<li><span>' + esc(f.name) + (it.sub && F[it.sub] ? ' <em class="sub-tag">вместо: ' + esc(shortName(F[it.sub])) + '</em>' : '') + (urgent ? ' <em class="tag-exp">' + (dl === 0 ? 'сегодня' : 'до завтра') + '</em>' : '') + '</span>' +
        '<span class="num">' + qtyLabel(f, it.g) + (miss ? ' <em class="tag-miss">нет ' + r0(miss.g) + '</em>' : '') + '</span></li>';
    }).join('') + '</ul>';
    const notes = [];
    if (m.light && !m.eaten) notes.push('Лёгкий приём: норма почти закрыта едой вне плана.');
    if (m.extra && F[m.extra]) notes.push((m.extraDense ? 'Калорийная добавка без лишнего объёма: ' : 'Добавка, чтобы добрать калории: ') + F[m.extra].name.toLowerCase() + '.');
    if (m.pinned && !m.eaten) notes.push('Блюдо выбрано тобой, граммовки подогнаны под норму.');
    if (m.skipped && m.skipped.length) notes.push('Можно без: ' + m.skipped.map((id) => shortName(F[id])).join(', ') + ' (нет дома).');
    detail += notes.map((n) => '<p class="hint">' + esc(n) + '</p>').join('');
    if (rec) detail += '<p class="steps-h">Как готовить · ' + rec.min + ' мин</p><ol class="steps-list">' + rec.steps.map((st) => '<li>' + esc(st) + '</li>').join('') + '</ol>';
    if (!m.eaten) detail += '<div class="meal-actions"><button class="btn ghost small" data-act="swap" data-i="' + i + '">Другой вариант</button></div>';

    return '<li class="meal' + (m.eaten ? ' eaten' : '') + (isNow ? ' now' : '') + (ui.justEaten === i ? ' just-eaten' : '') + (ui.justSwapped === i ? ' swap-in' : '') + '">' +
      '<div class="meal-time"><span class="num">' + esc(m.time) + '</span>' + (m.eaten ? '<span class="check" aria-label="съедено">✓</span>' : '') + '<span class="meal-type">' + esc(mealLabel(m)) + '</span></div>' +
      '<div class="meal-body"><details class="meal-more" data-open-key="' + key + '"' + (open ? ' open' : '') + '>' +
      '<summary><span class="meal-title">' + esc(title) + '</span><span class="macros"><b>' + r0(mm.kcal) + '</b> ккал · белок ' + r0(mm.p) + ' г</span>' +
      (sum ? '<span class="meal-sum">' + esc(sum) + '</span>' : '') + (tags ? '<span class="meal-tags">' + tags + '</span>' : '') + '</summary>' +
      '<div class="meal-detail">' + detail + '</div></details>' +
      (m.eaten ? '<button class="btn ghost small eat-btn" data-act="uneat" data-i="' + i + '">Отменить</button>'
        : '<button class="btn small eat-btn" data-act="eat" data-i="' + i + '">Съел</button>') +
      '</div></li>';
  }

  /**
   * Всё, что требует внимания сегодня, — в одном месте. На виду два самых
   * важных пункта (просрочка, часовой пояс, «скоро испортится»…), остальное — «Ещё».
   */
  function notices(plan, stale) {
    const F = fm();
    const list = [];
    const expired = Object.keys(S.inventory).filter((id) => F[id] && daysLeft(id) != null && daysLeft(id) < 0);
    if (expired.length) list.push({ level: 'danger', text: 'Просрочено: ' + expired.map((id) => shortName(F[id])).join(', ') + '. В меню не попадёт — не ешь.', act: 'drop-expired', label: 'Убрать' });
    if (S.tzNotice) {
      const d = S.tzNotice.diff;
      const h = Math.abs(d) % 1 ? Math.abs(d).toFixed(1).replace('.', ',') : Math.abs(d);
      list.push({ level: 'info', key: 'tz', cls: 'tz', text: 'Новый часовой пояс: ' + (d > 0 ? '+' : '−') + h + ' ч, ' + (d > 0 ? 'на восток' : 'на запад') + '. Еда, сон и напоминания — по местному времени.',
        body: jetlagTips(d), bodyLabel: 'Как быстрее привыкнуть', act: 'tz-ok', label: 'Понятно' });
    }
    const planned = {};
    plan.meals.forEach((m) => { if (!m.eaten) m.items.forEach((it) => { planned[it.id] = (planned[it.id] || 0) + it.g; }); });
    const soon = Object.keys(S.inventory).filter((id) => F[id] && daysLeft(id) != null && daysLeft(id) >= 0 && daysLeft(id) <= 2).sort((a, b) => daysLeft(a) - daysLeft(b));
    if (soon.length) {
      const when = (d) => (d === 0 ? 'сегодня' : d === 1 ? 'завтра' : 'через 2 дня');
      list.push({ level: 'warn', key: 'soon', cls: 'expiring', text: 'Скоро испортится: ' + soon.map((id) => shortName(F[id]) + ' (' + when(daysLeft(id)) + ')').join(', ') + '.',
        bodyLabel: 'Что из этого в плане',
        body: '<ul class="dots small">' + soon.map((id) => '<li>' + esc(F[id].name) + ': ' + (planned[id] ? 'в плане ' + r0(Math.min(planned[id], S.inventory[id])) + ' из ' + r0(S.inventory[id]) + (LIQUID[id] ? ' мл' : ' г') : 'пока не в плане') + '</li>').join('') + '</ul>' +
          (soon.some((id) => !planned[id]) ? '<p class="small">Мясо и рыбу можно заморозить: в морозилке они хранятся месяцы, после разморозки — сутки.</p>' : '') });
    }
    if (stale) list.push({ level: 'action', text: 'Запасы или норма изменились.', act: 'rebuild', label: 'Обновить план' });
    const wk = NF.weekStart(todayStr());
    if (S.weights.length && S.weights[0].date < wk && S.reportSeen !== wk) list.push({ level: 'info', text: 'Итоги прошлой недели готовы.', act: 'open-report', label: 'Открыть' });
    const lastM = S.measures.length ? S.measures[S.measures.length - 1].date : null;
    if (!lastM || NF.daysBetween(lastM, todayStr()) >= 14) list.push({ level: 'info', text: lastM ? 'Прошло 2 недели — пора сделать замеры.' : 'Сделай первые замеры тела: по ним видно, растут мышцы или жир.', act: 'open-measure', label: 'Замерить' });
    if (S.demoInventory) list.push({ level: 'info', text: 'Запасы сейчас — пример. Замени их на свои, и меню соберётся из твоих продуктов.', act: 'open-stock', label: 'Запасы' });
    return list;
  }

  function noticesBlock(list) {
    if (!list.length) return '';
    const row = (n) => '<div class="notice n-' + n.level + (n.cls ? ' ' + n.cls : '') + '"><span class="dot" aria-hidden="true"></span>' +
      '<div class="notice-main"><span>' + esc(n.text) + '</span>' +

  // ── часовой пояс: в поездках еда, сон и напоминания идут по местному времени ──
  function checkTimezone() {
    let tz = 'local';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local'; } catch (e) { /* ignore */ }
    const off = new Date().getTimezoneOffset();
    if (S.lastOffset != null && S.lastOffset !== off) {
      S.tzNotice = { tz: tz, diff: (S.lastOffset - off) / 60, date: todayStr() };
    }
    S.lastTz = tz; S.lastOffset = off;
  }

      (diff == null ? '<li>Летел на восток — ложись чуть раньше, на запад — продержись бодрым до местного вечера.</li>'

          : '<li>Ты летел на запад: продержись бодрым до местного вечера, утром вставай по будильнику.</li>') +

  /** Приём пищи «сейчас»: от 30 мин до его времени и до 90 мин после, если не съеден. */
  function currentMealIndex(plan) {
    const now = new Date(); const nm = now.getHours() * 60 + now.getMinutes();
    let idx = -1;
    plan.meals.forEach((m, i) => {
      if (m.eaten || idx >= 0) return;
      const t = NF.toMin(m.time);
      if (nm >= t - 30 && nm <= t + 90) idx = i;
    });
    return idx;
  }

    if (d == null && !NF.SHELF[id] && !(fm()[id] || {}).custom) return '';

  /** Состояние рецепта по запасам: чего нет, что заменяется. */
  function recipeState(r, inv, F) {
    const rs = NF.resolveRecipe(r, inv, F, false);
    const missing = rs.ings.filter((i) => i.missing).map((i) => i.food.id);
    const subs = rs.ings.filter((i) => i.sub).map((i) => ({ from: i.sub, to: i.food.id, title: NF.isTitleIngredient(r, i.sub, F) }));
    const group = missing.length === 0 ? 'now' : missing.length === 1 ? 'one' : missing.length <= 3 ? 'few' : 'rest';
    return { r: r, missing: missing, subs: subs, skipped: rs.skipped, group: group };
  }

  function recMealType(r) {
    if (ui.recFilter === 'b' || ui.recFilter === 's') return ui.recFilter;
    if (ui.recFilter === 'l') return r.meals.indexOf('l') >= 0 ? 'l' : 'd';
    return r.meals[0];
  }

  function recipeFit(r, F, inv) {
    const T = targets();
    if (!T) return null;
    return NF.fitRecipe(r, NF.targetFor(T, NF.MEAL_SHARE[recMealType(r)]), inv, F, false, { dense: !!S.lowAppetite });
  }
